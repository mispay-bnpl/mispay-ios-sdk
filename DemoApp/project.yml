name: MISPayDemo
options:
  bundleIdPrefix: com.finbyte
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  mispaysdk:
    path: ".."

targets:
  MISPayDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: mispaysdk
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MISPay Demo
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: The MIS Pay checkout pages may request your location.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
